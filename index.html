<meta name="description" content="Dr. Julio Vieira - Médico | Tricologia e Transplante Capilar (F.U.E) - Salvador-BA">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07120d;--green:#0b4a2b;--green2:#13633b;--gold:#c9a45c;--gold2:#e6c98a;--cream:#f0e8d6;--muted:#a9b5ad}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Montserrat,sans-serif;color:var(--cream);background:radial-gradient(ellipse at top,#0f3a25 0%,var(--bg) 60%) fixed;display:flex;justify-content:center;padding:48px 18px 32px}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:up .8s ease both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.avatar{width:128px;height:128px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--gold2),var(--gold),#8a6a2e);box-shadow:0 0 0 6px var(--green),0 10px 40px rgba(0,0,0,.5)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--bg)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.1rem;margin-top:26px;letter-spacing:.5px}
.role{color:var(--gold2);font-size:.82rem;letter-spacing:1.5px;text-transform:uppercase;margin-top:6px;font-weight:500}
.info{color:var(--muted);font-size:.8rem;margin-top:14px;line-height:1.7}
.info a{color:var(--gold);text-decoration:none}
.sep{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px 0}
.links{width:100%;display:flex;flex-direction:column;gap:14px}
.btn-l{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:17px 20px;border-radius:14px;text-decoration:none;color:var(--cream);font-weight:500;font-size:.95rem;background:linear-gradient(180deg,rgba(19,99,59,.55),rgba(11,74,43,.55));border:1px solid rgba(201,164,92,.35);transition:.25s;overflow:hidden}
.btn-l:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 1px var(--gold) inset;color:#fff}
.btn-l svg{width:22px;height:22px;flex:none;fill:var(--gold2)}
.btn-l span{flex:1;text-align:center;margin-right:36px}
.btn-l.hl{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#9c7838);color:#0b2416;font-weight:600;border:none;text-transform:uppercase;letter-spacing:1px;font-size:.88rem}
.btn-l.hl svg{fill:#0b2416}
.btn-l.hl::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:sh 3.2s infinite}
@keyframes sh{60%,100%{transform:translateX(100%)}}
.btn-l.disabled{cursor:default}
footer{margin-top:64px;display:flex;flex-direction:column;align-items:center;gap:18px}
footer img{width:220px;max-width:70%;opacity:.95;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
footer small{font-size:.66rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase}
</style>
</head>
